server:
  port: ${APP_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: riya-industries-web
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/riya_industries?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  thymeleaf:
    cache: true

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin:
    init-username: ${ADMIN_INIT_USERNAME:admin}
    init-email: ${ADMIN_INIT_EMAIL:admin@riyaindustries.example}
    init-password: ${ADMIN_INIT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
